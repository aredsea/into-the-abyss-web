:root{color-scheme:light;--paper:#f4efe3;--ink:#111715;--red:#c62b15;--muted:#62665d;--pale:#e6dfcf}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:500 15px/1.6 Abyss,sans-serif}
::selection{background:var(--red);color:var(--paper)}#canvas{display:block;touch-action:none}#canvas:focus{outline:none}
#status{position:fixed;inset:0;z-index:2;overflow:auto;background:var(--paper);scrollbar-color:var(--ink) var(--paper)}
.screen{position:relative;isolation:isolate;width:100%;max-width:460px;min-height:100%;margin:auto;display:flex;flex-direction:column;padding:18px 18px calc(24px + env(safe-area-inset-bottom));background:var(--paper)}
h1{margin:0;width:100%;line-height:1}h1 svg{display:block;width:100%;height:auto}.subtitle{margin:12px 0 0;font-size:15px;font-weight:850}
.space{position:relative;flex:1;min-height:170px;margin:8px -18px 12px;overflow:hidden}.city-left,.city-right{position:absolute;bottom:0;width:56%;height:100%;max-height:280px}.city-left{left:-4%}.city-right{right:-5%;width:64%}.sweep{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.status-box{padding:18px 0 0;border-top:3px solid var(--ink);background:var(--paper)}.status-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}h2{font-size:17px;line-height:1.5;font-weight:850;margin:0}#percent{color:var(--red);font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}
progress{display:block;appearance:none;width:100%;height:8px;border:0;background:var(--pale);margin:16px 0;accent-color:var(--red)}progress::-webkit-progress-bar{background:var(--pale)}progress::-webkit-progress-value{background:var(--red)}progress::-moz-progress-bar{background:var(--red)}
#hint{font-size:14px;color:var(--muted);min-height:44px;margin:12px 0 0}button{font:850 15px/1.6 Abyss,sans-serif;color:var(--paper);border:2px solid var(--red);border-radius:0;background:var(--red);width:100%;min-height:48px;margin-top:14px;padding:10px 12px;cursor:pointer}button:hover{background:var(--ink);border-color:var(--ink)}button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}[hidden]{display:none!important}
noscript{position:fixed;z-index:3;bottom:24px;left:20px;right:20px;padding:16px;background:var(--paper);color:var(--ink)}
@media(max-height:700px){.screen{padding-top:12px}h1{width:82%}.space{min-height:100px}.subtitle{margin-top:8px}.status-box{padding-top:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<section class="status-box" aria-live="polite"><div class="status-head"><h2 id="state">게임 파일을 불러오는 중</h2><span id="percent"></span></div><progress id="progress" aria-label="게임 파일 다운로드"></progress><p id="hint">탐색 카드는 보유한 패에 추가됩니다.<br>사용하면 한 장 소모됩니다.</p><button id="retry" hidden>다시 시도</button></section>
</main></div>
<noscript>게임을 실행하려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
<dialog id="cloud-challenge" aria-labelledby="cloud-challenge-title">
<h2 id="cloud-challenge-title">계정 만들기 인증</h2>
<p id="cloud-challenge-note" role="status">인증을 완료하면 모험 기록을 저장합니다.</p>
<div id="cloud-challenge-widget"></div>
<button id="cloud-challenge-cancel" type="button">취소하고 게임으로</button>
</dialog>
<style>
#cloud-challenge{width:min(100% - 32px,380px);max-height:calc(100% - 32px);overflow:auto;border:3px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);padding:24px;font:500 16px/1.6 Abyss,sans-serif}
#cloud-challenge::backdrop{background:#11171580}
#cloud-challenge h2{font-size:20px}#cloud-challenge p{margin:12px 0 20px}
#cloud-challenge-widget{min-height:65px}#cloud-challenge button{margin-top:20px}
#cloud-challenge ::selection{background:var(--red);color:var(--paper)}
</style>
<script>
(() => {
 const dialog=document.getElementById('cloud-challenge'),container=document.getElementById('cloud-challenge-widget');
 let state={status:'idle',token:''},widget=null,loading=null,generation=0;
 function remove(){if(widget!==null&&window.turnstile){window.turnstile.remove(widget);widget=null;}container.replaceChildren();}
 function close(){if(dialog.open)dialog.close();document.getElementById('canvas').focus();}
 function stop(status){++generation;state={status,token:''};remove();close();}
 async function load(){
  if(window.turnstile)return;
  if(!loading)loading=new Promise((resolve,reject)=>{
   const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';script.async=true;script.crossOrigin='anonymous';
   script.onload=()=>resolve();script.onerror=()=>{script.remove();loading=null;reject(new Error('challenge_unavailable'));};document.head.append(script);
  });
  await loading;
 }
 window.abyssTurnstile={
  async begin(sitekey){
   stop('pending');const attempt=generation;dialog.showModal();
   try{
    await load();if(attempt!==generation)return;
    widget=window.turnstile.render(container,{sitekey,action:'account',theme:'light',size:'flexible',
     callback:token=>{if(attempt===generation){state={status:'success',token};close();}},
     'expired-callback':()=>{if(attempt===generation)stop('error');},
     'error-callback':()=>{if(attempt===generation)stop('error');}
    });
   }catch{if(attempt===generation)stop('error');}
  },
  poll(){return JSON.stringify(state);},
  finish(){stop('idle');}
 };
 document.getElementById('cloud-challenge-cancel').onclick=()=>stop('cancelled');
 dialog.addEventListener('cancel',event=>{event.preventDefault();stop('cancelled');});
})();
</script>
<script>
window.abyssLoadingFailed=function(error){
 document.getElementById('state').textContent='게임을 시작하지 못했습니다';
 document.getElementById('percent').textContent='';document.getElementById('progress').hidden=true;
 document.getElementById('hint').textContent=error||'인터넷 연결을 확인한 뒤 다시 시도해 주세요.';
 document.getElementById('retry').hidden=false;
};
document.getElementById('retry').onclick=()=>location.reload();
</script>
<script src="$GODOT_URL" onerror="abyssLoadingFailed()"></script>
<script>
(() => {
 const config=$GODOT_CONFIG;
 const label=document.getElementById('state'),percent=document.getElementById('percent'),bar=document.getElementById('progress');
 if(typeof Engine==='undefined'){abyssLoadingFailed();return;}
 try{
  const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
  if(missing.length){abyssLoadingFailed('이 브라우저에서 필요한 그래픽 기능을 사용할 수 없습니다. 최신 브라우저에서 다시 열어 주세요.');return;}
  const engine=new Engine(config);
  engine.startGame({onProgress(current,total){
   if(total>0&&current>=total){label.textContent='게임 시작을 준비하는 중';percent.textContent='';bar.hidden=true;}
   else if(total>0){label.textContent='게임 파일을 불러오는 중';bar.hidden=false;bar.max=total;bar.value=current;percent.textContent=Math.floor(current/total*100)+'%';}
   else{label.textContent='게임 파일을 불러오는 중';bar.hidden=false;bar.removeAttribute('value');percent.textContent='';}
  }}).then(()=>{document.getElementById('status').remove();document.getElementById('canvas').focus();},()=>abyssLoadingFailed());
 }catch(error){abyssLoadingFailed();}
})();
</script>
