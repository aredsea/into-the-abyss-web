<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Into the Abyss</title>
<style>
@font-face{font-family:Gowun;src:url("ui-r11/GowunBatang-loading.woff2") format("woff2");font-display:swap}
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf3f8;color:#253c52;font:15px/1.6 Gowun,serif}#canvas{display:block;touch-action:none}#canvas:focus{outline:none}
#status{position:fixed;inset:0;z-index:2;overflow:auto;background:#edf3f8}.screen{position:relative;isolation:isolate;max-width:460px;min-height:100%;margin:auto;display:flex;flex-direction:column;padding:28px 26px calc(24px + env(safe-area-inset-bottom));background:#edf3f8}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.screen:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(#edf3f8e8,transparent 55%,#edf3f8dc)}
h1{font:48px/1.06 Gowun,serif;letter-spacing:-1px;margin:38px 0 12px;color:#253c52}.subtitle{margin:0;font-size:14px;color:#253c52}.space{flex:1;min-height:210px}.status-box{padding:20px 18px;border:1px solid #a6bcca;border-radius:8px;background:#fffdf8f5}.status-head{display:flex;justify-content:space-between;gap:10px;align-items:center}h2{font-size:16px;line-height:1.5;font-weight:400;margin:0}#percent{color:#355f80;white-space:nowrap}progress{display:block;appearance:none;width:100%;height:8px;border:0;border-radius:4px;background:#dce8f2;margin:16px 0;accent-color:#355f80}progress::-webkit-progress-bar{background:#dce8f2}progress::-webkit-progress-value{background:#355f80}progress::-moz-progress-bar{background:#355f80}#hint{font-size:13px;color:#526b7e;min-height:40px;margin:12px 0 0}button{font:inherit;color:#fffdf8;border:1px solid #8c6833;border-radius:6px;background:#355f80;width:100%;min-height:48px;margin-top:14px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #355f80;outline-offset:3px}[hidden]{display:none!important}noscript{position:fixed;z-index:3;bottom:24px;left:20px;right:20px;padding:16px;background:#fffdf8;color:#253c52}@media(max-height:700px){h1{font-size:38px;margin-top:12px}.space{min-height:120px}.screen{padding-top:18px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<meta name="color-scheme" content="light">
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Into the Abyss 게임 화면">이 브라우저는 게임 화면을 지원하지 않습니다.</canvas>
<div id="status"><main class="screen">
<img class="art" src="ui-r11/torva-daylight.png" alt="" fetchpriority="high" onerror="this.hidden=true">
<h1>Into the<br>Abyss</h1><p class="subtitle">학술원 폐허</p><div class="space"></div>
<section class="status-box" aria-live="polite"><div class="status-head"><h2 id="state">게임 파일을 불러오는 중</h2><span id="percent"></span></div><progress id="progress" aria-label="게임 파일 다운로드"></progress><p id="hint">탐색 카드는 보유한 패에 추가됩니다.<br>사용하면 한 장 소모됩니다.</p><button id="retry" hidden>다시 시도</button></section>
</main></div>
<noscript>게임을 실행하려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
<script>
window.abyssLoadingFailed=function(error){
 document.getElementById('state').textContent='게임을 시작하지 못했습니다';
 document.getElementById('percent').textContent='';document.getElementById('progress').hidden=true;
 document.getElementById('hint').textContent=error||'인터넷 연결을 확인한 뒤 다시 시도해 주세요.';
 document.getElementById('retry').hidden=false;
};
document.getElementById('retry').onclick=()=>location.reload();
</script>
<script src="index.js" onerror="abyssLoadingFailed()"></script>
<script>
(() => {
 const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":49885048,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
 const label=document.getElementById('state'),percent=document.getElementById('percent'),bar=document.getElementById('progress');
 if(typeof Engine==='undefined'){abyssLoadingFailed();return;}
 try{
  const missing=Engine.getMissingFeatures({threads:false});
  if(missing.length){abyssLoadingFailed('이 브라우저에서 필요한 그래픽 기능을 사용할 수 없습니다. 최신 브라우저에서 다시 열어 주세요.');return;}
  const engine=new Engine(config);
  engine.startGame({onProgress(current,total){
   if(total>0&&current>=total){label.textContent='게임 시작을 준비하는 중';percent.textContent='';bar.hidden=true;}
   else if(total>0){label.textContent='게임 파일을 불러오는 중';bar.hidden=false;bar.max=total;bar.value=current;percent.textContent=Math.floor(current/total*100)+'%';}
   else{label.textContent='게임 파일을 불러오는 중';bar.hidden=false;bar.removeAttribute('value');percent.textContent='';}
  }}).then(()=>{document.getElementById('status').remove();document.getElementById('canvas').focus();},()=>abyssLoadingFailed());
 }catch(error){abyssLoadingFailed();}
})();
</script>
</body></html>
