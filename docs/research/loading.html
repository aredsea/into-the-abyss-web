<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Into the Abyss 로딩 화면 시안</title>
<style>
:root{color-scheme:dark;--ink:#151a1b;--gold:#d7b67e;--paper:#eae4d6}*{box-sizing:border-box}body{margin:0;background:#0b0e0f;color:var(--paper);font:15px/1.5 "Malgun Gothic",sans-serif}.screen{position:relative;isolation:isolate;max-width:460px;min-height:100svh;margin:auto;background:var(--ink);display:flex;flex-direction:column;padding:22px 26px calc(20px + env(safe-area-inset-bottom))}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-1}.top{display:flex;justify-content:space-between;align-items:center;font-size:12px}.top a{color:var(--paper);display:inline-flex;align-items:center;min-height:44px}.tag{background:#151a1bd9;padding:5px 9px}h1{font:42px/.98 Georgia,serif;margin:32px 0 8px;color:#e6d6b8;font-weight:400;letter-spacing:-1px}.subtitle{font-size:13px;color:#c1bbad;margin:0}.space{flex:1;min-height:240px}.status{background:#101617eb;padding:17px 16px 15px;border:1px solid #73684e}.status-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.status h2{margin:0;font-size:16px;font-weight:400}.percent{color:var(--gold);white-space:nowrap}.track{height:9px;border:1px solid #746a51;background:#111718;margin:13px 0}.fill{width:62%;height:100%;background:#b7a16f}.hint{margin:0;font-size:13px;color:#cbc8bd;min-height:39px}.controls{display:flex;gap:6px;margin-top:16px}.controls button,.retry{font:inherit;color:var(--paper);background:#1d2424;border:1px solid #71664e;min-height:44px;padding:8px 10px;cursor:pointer}.controls button{flex:1;font-size:12px}.controls button[aria-pressed=true]{border-color:#e6cd98;color:#efd4a1}.controls button:focus-visible,a:focus-visible,.retry:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.caption{font-size:12px;color:#c2c4b9;margin:9px 0 0}.retry{width:100%;margin-top:10px}.retry[hidden]{display:none}@media(max-height:720px){h1{margin-top:14px;font-size:34px}.space{min-height:160px}.screen{padding-top:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="screen"><img class="art" src="assets/academy-loading-v1.png" alt="빛이 드는 무너진 학술원 회랑과 아래층으로 이어지는 계단"><div class="top"><a href="index.html">조사로 돌아가기</a><span class="tag">로딩 화면 시안</span></div><h1>Into the<br>Abyss</h1><p class="subtitle">학술원 폐허</p><div class="space"></div><section class="status" aria-live="polite"><div class="status-head"><h2 id="state">게임 파일을 불러오는 중</h2><span id="percent" class="percent">62%</span></div><div id="track" class="track" role="progressbar" aria-label="게임 파일 다운로드" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62"><div class="fill"></div></div><p class="hint" id="hint">탐색 카드는 손패에 보관됩니다.<br>사용하면 한 장 소모됩니다.</p><button class="retry" id="retry" hidden>다시 시도</button></section><div class="controls" aria-label="미리 볼 상태 선택"><button data-state="download" aria-pressed="true">다운로드</button><button data-state="prepare" aria-pressed="false">시작 준비</button><button data-state="error" aria-pressed="false">오류</button></div><p class="caption">62%는 배치 확인용 예시입니다. 실제 게임 로딩과 연결되지 않은 시안입니다.</p></main><script>
const states={download:['게임 파일을 불러오는 중','62%','탐색 카드는 손패에 보관됩니다.<br>사용하면 한 장 소모됩니다.'],prepare:['게임 시작을 준비하는 중','','다운로드가 끝났습니다.<br>잠시만 기다려 주세요.'],error:['게임 파일을 불러오지 못했습니다','','인터넷 연결을 확인한 뒤<br>다시 시도해 주세요.']};
function show(key){const s=states[key];document.querySelector('#state').textContent=s[0];document.querySelector('#percent').textContent=s[1];document.querySelector('#hint').innerHTML=s[2];document.querySelector('#track').hidden=key!=='download';document.querySelector('#retry').hidden=key!=='error';document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===key)));}document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>show(b.dataset.state));document.querySelector('#retry').onclick=()=>show('download');
</script></body></html>
